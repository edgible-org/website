<!doctype html>
<html lang="en">
<head>
  <script>document.documentElement.className += " js";</script>
  <link rel="stylesheet" href="{{root}}menu.css">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Edgible</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#111827">
  <link rel="icon" type="image/png" href="{{root}}images/favicon.png">
  <link rel="alternate" type="text/markdown" title="This page as Markdown" href="{{source}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* The main page's typeface, colours, top bar and footer (site/index.html), with styles for reading. */
    @font-face { font-family: "Nexa"; src: url("{{root}}fonts/Nexa-Regular.otf") format("opentype"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Nexa"; src: url("{{root}}fonts/Nexa-Bold.otf") format("opentype"); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: "Nexa"; src: url("{{root}}fonts/Nexa-ExtraBold.otf") format("opentype"); font-weight: 800; font-style: normal; font-display: swap; }
    /* Playbooks are for doing, so they read on a light page; the dark top bar keeps them Edgible's. */
    :root {
      --night-1: #111827;
      --line: #e3e6ef;
      --paper: #fbfaf7;
      --surface: #f1f2f7;
      --yellow: #ffd21f;
      --prompt: #fff8d6;
      --link: #2e4a9e;
      --heading: #111827;
      --ink: #2b3245;
      --muted: #5d6680;
      --radius: 14px;
      --wrap: 1120px;
      --read: 760px;
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body { margin: 0; font-family: Nexa, Jost, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; color: var(--ink); background: var(--paper); line-height: 1.7; -webkit-font-smoothing: antialiased; }
    a { color: var(--link); }
    .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }

    header.bar { position: sticky; top: 0; z-index: 10; background: var(--night-1); border-bottom: 1px solid rgba(255,255,255,.12); }
    header.bar .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo img { display: block; height: 24px; width: auto; }
    nav.links { display: flex; gap: 24px; font-weight: 500; font-size: 16px; }
    nav.links a { text-decoration: none; color: #a7b1dc; }
    nav.links a:hover { color: #ffffff; }

    main { max-width: var(--read); margin: 0 auto; padding: 56px 24px 88px; }
    h1, h2, h3 { color: var(--heading); line-height: 1.25; font-weight: 800; }
    h1 { font-size: 40px; margin: 0 0 16px; }
    h2 { font-size: 26px; margin: 48px 0 12px; }
    h3 { font-size: 20px; margin: 32px 0 8px; }
    p, li { max-width: 70ch; }
    strong { color: var(--heading); }
    /* A quote is something to say to your AI, or a box such as What you need. */
    blockquote { margin: 20px 0; padding: 16px 20px; background: var(--prompt); border-left: 4px solid var(--yellow); border-radius: 0 var(--radius) var(--radius) 0; color: var(--heading); }
    blockquote p { margin: 0; }
    blockquote p + p, blockquote ul { margin-top: 10px; }
    code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .9em; background: var(--surface); padding: 2px 6px; border-radius: 6px; }
    pre { background: var(--night-1); color: #e6eaff; border-radius: var(--radius); padding: 16px 18px; overflow-x: auto; }
    pre code { background: none; padding: 0; color: inherit; }
    details { margin: 24px 0; padding: 12px 18px; background: #ffffff; border: 1px solid var(--line); border-radius: var(--radius); }
    summary { cursor: pointer; color: var(--heading); font-weight: 700; }
    table { border-collapse: collapse; width: 100%; margin: 20px 0; font-size: 16px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--heading); }
    hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }
    /* The site's icons are drawn light on dark, so on these pages each sits on a navy tile. */
    /* A page's icon: a navy tile above its title; a small one beside each entry on the landing page. */
    .page-ico { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 14px; background: var(--night-1); color: #ffffff; margin-bottom: 18px; }
    .page-ico svg { width: 42px; height: 42px; }
    .ico.sm { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; background: var(--night-1); margin-right: 10px; vertical-align: middle; }
    .ico.sm svg { width: 22px; height: 22px; }
    /* The icons draw in the text colour, so give every navy tile a white one */
    .ico, .page-ico, .flow use { color: #ffffff; }
    /* A list item with an icon: no bullet or number (the map above has the numbers), the icon hangs in the margin
       and the text, even when it wraps, stays in its own column */
    li:has(.ico.sm) { list-style: none; position: relative; padding-left: 54px; margin: 18px 0; min-height: 34px; }
    li .ico.sm { position: absolute; left: 0; top: -2px; width: 36px; height: 36px; margin: 0; }
    li .ico.sm svg { width: 26px; height: 26px; }
    ul:has(.ico.sm), ol:has(.ico.sm) { padding-left: 0; }
    li:has(.ico.sm) > p { margin: 0; }
    li > ol:has(.ico.sm) { margin: 14px 0 0; }
    li > ol > li:has(.ico.sm) { margin: 12px 0; }
    h2 .ico { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; background: var(--night-1); margin-right: 12px; vertical-align: middle; flex: none; }
    h2 .ico svg { width: 30px; height: 30px; }
    h2:has(.ico) { display: flex; align-items: center; }

    /* Previous and Next, at the end of each chapter. */
    nav.chapters { display: flex; gap: 14px; margin-top: 56px; flex-wrap: wrap; }
    nav.chapters a { flex: 1 1 240px; display: block; padding: 16px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: #ffffff; text-decoration: none; color: var(--heading); font-weight: 700; }
    nav.chapters a:hover { border-color: var(--link); }
    nav.chapters a span { display: block; font-size: 14px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
    nav.chapters a.next { text-align: right; margin-left: auto; }
    footer { padding: 32px 0; font-size: 14px; color: #a7b1dc; background: var(--night-1); }
    footer a { color: #a7b1dc; }
    footer a:hover { color: #ffffff; }
    footer .wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
    footer .foot-right { display: flex; align-items: center; gap: 20px; }
    footer .foot-logo img { display: block; height: 36px; width: auto; opacity: .9; }

    @media (max-width: 560px) {
      .wrap { padding: 0 16px; }
      main { padding: 40px 16px 64px; }
      nav.links { gap: 16px; font-size: 15px; }
      h1 { font-size: 32px; }
      table { display: block; overflow-x: auto; }
    }
    /* The route through the playbooks, drawn. */
    figure.flow { margin: 28px auto; max-width: 460px; }
    figure.flow svg { width: 100%; height: auto; display: block; font-family: inherit; }
    .flow a { cursor: pointer; }
    .flow .frame { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .flow .box { fill: #ffffff; stroke: var(--line); stroke-width: 1.5; }
    .flow .box.opt { stroke-dasharray: 5 4; stroke: var(--muted); }
    .flow a:hover .box, .flow a:focus .box { stroke: var(--link); }
    .flow .num { fill: var(--yellow); }
    .flow .numt { fill: var(--heading); font-weight: 800; font-size: 14px; }
    .flow .t { fill: var(--heading); font-weight: 800; font-size: 17px; }
    .flow .t.b { font-size: 15px; }
    .flow .s { fill: var(--muted); font-size: 13.5px; }
    .flow .s2 { fill: var(--heading); font-weight: 700; font-size: 14px; }
    .flow .arr { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="logo" href="{{root}}"><img src="{{root}}images/edgible-logo-white.png" alt="Edgible" width="107" height="24"></a>
    <button class="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav"><span></span></button>
    <nav class="links" id="site-nav">
      <a href="{{root}}playbooks/">Playbooks</a>
      <a href="https://cards.edgible.org">Cards</a>
      <a href="{{root}}proof/">Proof</a>
      <a href="{{root}}contact/">Contact</a>
    </nav>
  </div>
</header>
<main>
{{content}}
</main>
<footer>
  <div class="wrap">
    <span>© 2026 Edgible. Your data's coming home™ is a trade mark of Edgible.</span>
    <div class="foot-right">
      <span><a href="https://cards.edgible.org">Cards</a> · <a href="{{root}}contact/">Contact</a> · <a href="{{root}}llms.txt">For AI assistants</a> · <a href="{{source}}">This page as Markdown</a></span>
      <a class="foot-logo" href="{{root}}"><img src="{{root}}images/edgible-symbol-white.png" alt="Edgible"></a>
    </div>
  </div>
</footer>
<script src="{{root}}menu.js" defer></script>
</body>
</html>
